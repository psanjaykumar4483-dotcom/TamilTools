<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - TamilTools</title>
    <meta name="description" content="TamilTools - Simple and useful online tools.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Tamil<span>Tools</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">Tools</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button id="themeBtn">🌙</button>

    </header>


    <main>

        <section class="hero">

            <p class="tag">📩 Get in Touch</p>

            <h1>
                Contact <span>Us.</span>
            </h1>

            <p class="description">
                Have a suggestion, feedback or found a problem?
                Send us a message.
            </p>

        </section>


        <section class="contact-section">

            <div class="contact-box">

                <h2>Send a Message</h2>

                <form id="contactForm">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Write your message..."
                        required
                    ></textarea>


                    <button type="submit" class="contact-button">
                        Send Message →
                    </button>

                </form>

                <p id="formMessage"></p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 TamilTools. All rights reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>
</html>
