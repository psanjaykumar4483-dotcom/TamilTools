<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - TamilTools</title>
    <meta name="description" content="TamilTools - Simple and useful online tools.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Tamil<span>Tools</span></div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">Tools</a>
        </nav>

        <button id="themeBtn">🌙</button>
    </header>


    <main>

        <section class="hero">
            <p class="tag">🧮 TamilTools</p>

            <h1>Calculator</h1>

            <p class="description">
                Simple and fast online calculator.
            </p>
        </section>


        <section class="tools-section">

            <div class="calculator">

                <input
                    type="text"
                    id="display"
                    readonly
                    placeholder="0"
                >

                <div class="calculator-buttons">

                    <button onclick="clearDisplay()">AC</button>
                    <button onclick="deleteLast()">⌫</button>
                    <button onclick="appendValue('%')">%</button>
                    <button onclick="appendValue('/')">÷</button>

                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="appendValue('*')">×</button>

                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="appendValue('-')">−</button>

                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="appendValue('+')">+</button>

                    <button onclick="appendValue('0')" class="zero">0</button>
                    <button onclick="appendValue('.')">.</button>
                    <button onclick="calculateResult()" class="equal">=</button>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 TamilTools. All rights reserved.</p>
    </footer>


    <script src="../script.js"></script>

</body>
</html>
