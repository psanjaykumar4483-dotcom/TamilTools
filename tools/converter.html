<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit Converter - TamilTools</title>
    <meta name="description" content="TamilTools - Simple and useful online tools.">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Tamil<span>Tools</span></div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">Tools</a>
        </nav>

        <button id="themeBtn">🌙</button>
    </header>


    <main>

        <section class="hero">
            <p class="tag">🔄 TamilTools</p>

            <h1>Unit Converter</h1>

            <p class="description">
                Convert length, weight and temperature easily.
            </p>
        </section>


        <section class="tools-section">

            <div class="converter-box">

                <label>Category</label>

                <select id="category" onchange="updateUnits()">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                    <option value="temperature">Temperature</option>
                </select>


                <label>Enter Value</label>

                <input
                    type="number"
                    id="inputValue"
                    placeholder="Enter value"
                    oninput="convertUnit()"
                >


                <div class="unit-row">

                    <div>
                        <label>From</label>

                        <select id="fromUnit" onchange="convertUnit()">
                        </select>
                    </div>


                    <div>
                        <label>To</label>

                        <select id="toUnit" onchange="convertUnit()">
                        </select>
                    </div>

                </div>


                <div class="conversion-result">
                    <p>Result</p>
                    <h2 id="conversionResult">0</h2>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 TamilTools. All rights reserved.</p>
    </footer>


    <script src="../script.js"></script>

</body>
</html>
